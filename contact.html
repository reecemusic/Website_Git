    <div class="wrap header-inner">
      <a class="logo" href="index.html">Reece Williams Music</a>

  <main>
    <section class="page-intro contact-page-intro">
      <div class="wrap">
        <h1>Get in touch</h1>
      </div>
    </section>

    <section class="section contact-section">
      <div class="wrap contact-layout">
        <img class="contact-section-image" src="images/contact/contact-01.jpg" alt="Reece Williams playing piano beside a window in Abu Dhabi">
        <div class="contact-details">
          <p><strong>Email:</strong> <a href="mailto:info@reecemusic.com">info@reecemusic.com</a></p>
          <p><strong>Phone:</strong> <a href="tel:+971584646882">+971 58 46 4882</a></p>
          <p><strong>Location:</strong> Abu Dhabi, United Arab Emirates</p>
        </div>

        <form class="contact-form" id="contact-form" action="contact.php" method="POST">
          <label class="sr-only" aria-hidden="true">
            Website
            <input type="text" name="website" tabindex="-1" autocomplete="off">
          </label>
          <label>
            Name
            <input type="text" name="name" required>
          </label>
          <label>
            Email
            <input type="email" name="email" required>
          </label>
          <label>
            Message
            <textarea name="message" rows="6" required></textarea>
          </label>
          <label class="contact-check">
            <input type="checkbox" name="human" value="yes" required>
            <span>Tick if you are not a robot</span>
          </label>
          <label class="contact-check">
            <input type="checkbox" name="human-confirmation" value="yes" checked>
            <span>Untick if you are not a robot</span>
          </label>
          <button class="button" type="submit">Send message</button>
          <p class="form-status" id="contact-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">

    </div>
